<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Encadeada</title>

        <style>
        body {
            font-family: Arial;
            margin: 30px;
        }
        button{
            width: 150px;
        }
        input{
            width: 450px;
        }
        input, button{
            margin: 5px;
            padding: 8px;
        }
        #saida{
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
        }
    </style>

</head>
<body>
    
    <h1>Lista Encadeada (Versão Simples)</h1>

    <input type="text" id="nome" placeholder="Digite um nome">
    <br>
    <button onclick = "adicionarTarefa()">Adicionar Tarefa</button>
    <button onclick = "urgente()">Tarefa Urgente</button>
    <button onclick = "concluirTarefa()">Concluir Tarefa</button>
    <button onclick = "mostrar()">Mostrar Tarefas</button>
    <br>
    <br>
    <button onclick = "contar()">Contar Tarefas</button>
    <button onclick = "removerTarefa()">Remover Tarefa</button>
    <button onclick = "prioridade()">Subir Prioridade</button>

    <div id="saida"></div>

    <script>

    let valores = [];
    let proximo = [];
    
    let inicio = -1;
    let ultimo = -1;

    function adicionarTarefa(){
        let nome = document.getElementById("nome").value;

        if (nome === ""){
            alert("Digite um nome");
            return;
        }

        let novoIndice = valores.length;
        valores.push(nome);
        proximo.push(-1);

        if (inicio === -1){
            inicio = novoIndice;
            ultimo = novoIndice;
        } else {
            proximo[ultimo] = novoIndice;
            ultimo = novoIndice;
        }

        document.getElementById("nome").value = "";

        mostrar();
    }

    function urgente(){
        let nomeBusca = document.getElementById("nome").value;

        if (nomeBusca === ""){
            alert("Digite um nome");
            return;
        }

        if (inicio === -1){
            alert("Lista Vazia")
            return;
        }

        let atual = inicio;
        let anterior = -1;
        let encontrou = false;

        while(atual !== -1){

            if (valores[atual] === nomeBusca){
                encontrou = true;
                break;
            }

            anterior = atual;
            atual = proximo[atual];
        }

        if (encontrou){
            if(anterior === -1)
                return;
            
            proximo[anterior] = proximo[atual];

            proximo[atual] = inicio;

            inicio = atual;
            
            if (atual === ultimo)
                ultimo = anterior;

            mostrar();
        }else
            document.getElementById("saida").innerHTML = "Nome não encontrado na Lista.";
    }

    function concluirTarefa(){
        if (inicio === -1){
            alert("Lista Vazia")
            return;
        }

        inicio = proximo[inicio];

        if (inicio === -1)
            ultimo = -1;
        
        mostrar();
    }

    function mostrar(){
        let resultado = "";
        let atual = inicio;

        if (inicio === -1)
            resultado = "Lista vazia";
        

        while (atual !== -1){
            resultado += " → " + valores[atual];
            atual = proximo[atual];
        }

        document.getElementById("saida").innerHTML = resultado;
    }

    function contar(){

        let total = 0
        let atual = inicio;

        while (atual !== -1){
            atual = proximo[atual];
            total++;
        }

        let string = "Total de tarefas = " + total;

        document.getElementById("saida").innerHTML = string;
    }

    function removerTarefa(){

        let nomeBusca = document.getElementById("nome").value;

        if (nomeBusca === ""){
            alert("Digite um nome");
            return;
        }

        if (inicio === -1){
            alert("Lista Vazia")
            return;
        }

        let atual = inicio;
        let anterior = -1;
        let encontrou = false;

        while(atual !== -1){

            if (valores[atual] === nomeBusca){
                encontrou = true;
                break;
            }

            anterior = atual;
            atual = proximo[atual];
        }

        if (encontrou){
            if(anterior === -1)
                concluirTarefa();
            else
                proximo[anterior] = proximo[atual];
            
            if (atual === ultimo) 
                ultimo = anterior;
        
            alert("Elemento removido");

            mostrar();
        }else
            document.getElementById("saida").innerHTML = "Nome não encontrado na Lista.";

        document.getElementById("nome").value = "";
    }

    function prioridade(){

        let nomeBusca = document.getElementById("nome").value;

        if (nomeBusca === ""){
            alert("Digite um nome");
            return;
        }

        if (inicio === -1){
            alert("Lista Vazia")
            return;
        }

        let atual = inicio;
        let antepenultimo = -2;
        let anterior = -1;
        let encontrou = false;

        while(atual !== -1){

            if (valores[atual] === nomeBusca){
                encontrou = true;
                break;
            }

            antepenultimo = anterior;
            anterior = atual;
            atual = proximo[atual];
        }

        if (encontrou){

            if(anterior === -1)
                return;

            if(antepenultimo === -1){

                proximo[anterior] = proximo[atual];
                proximo[atual] = anterior;
                inicio = atual;
            }
            else{

                proximo[anterior] = proximo[atual];
                proximo[antepenultimo] = atual;
                proximo[atual] = anterior;
            }

            if(atual === ultimo)
                ultimo = anterior;

        }else
            document.getElementById("saida").innerHTML = "Nome não encontrado na Lista.";

        mostrar();

        document.getElementById("nome").value = "";
    }

    </script>

</body>
</html>
